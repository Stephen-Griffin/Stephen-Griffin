
<svg 
width="900" 
height="280" 
viewBox="0 0 900 280" 
fill="none" 
xmlns="http://www.w3.org/2000/svg"

  <style>
    .mono {
      font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono",
        "Liberation Mono", Menlo, monospace;
    }

    .name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 4px;
      fill: #f0f6fc;
    }

    .terminal {
      font-size: 22px;
      fill: #8b949e;
    }

    .prompt {
      fill: #58a6ff;
      font-weight: 700;
    }

    .role {
      fill: #f0f6fc;
    }

    .stack {
      font-size: 16px;
      letter-spacing: 2px;
      fill: #8b949e;
    }

    .cursor {
      fill: #58a6ff;
      animation: blink 1s steps(1) infinite;
    }

    .role-1,
    .role-2,
    .role-3,
    .role-4 {
      opacity: 0;
    }

    .role-1 {
      animation: role1 12s infinite;
    }

    .role-2 {
      animation: role2 12s infinite;
    }

    .role-3 {
      animation: role3 12s infinite;
    }

    .role-4 {
      animation: role4 12s infinite;
    }

    @keyframes blink {
      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    @keyframes role1 {
      0%,
      20% {
        opacity: 1;
      }

      24%,
      100% {
        opacity: 0;
      }
    }

    @keyframes role2 {
      0%,
      24% {
        opacity: 0;
      }

      25%,
      45% {
        opacity: 1;
      }

      49%,
      100% {
        opacity: 0;
      }
    }

    @keyframes role3 {
      0%,
      49% {
        opacity: 0;
      }

      50%,
      70% {
        opacity: 1;
      }

      74%,
      100% {
        opacity: 0;
      }
    }

    @keyframes role4 {
      0%,
      74% {
        opacity: 0;
      }

      75%,
      95% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }
  </style>


  <!-- Card -->
<rect
x="2"
y="2"
width="896"
height="276"
rx="16"
fill="#0d1117"
stroke="#30363d"
stroke-width="2"
/>










  <!-- Tiny terminal dots -->
  <circle cx="32" cy="28" r="5" fill="#ff5f56" />
  <circle cx="50" cy="28" r="5" fill="#ffbd2e" />
  <circle cx="68" cy="28" r="5" fill="#27c93f" />

  <!-- Name -->
<text 
x="55" 
y="100" 
class="mono name"

STEPHEN GRIFFIN
  </text>

  <!-- Prompt -->
<text 
x="55" 
y="158" 
class="mono terminal prompt"

&gt;
  </text>

  <!-- Cycling roles -->
<text 
x="83" 
y="158" 
class="mono terminal role role-1"

software engineer
  </text>

<text 
x="83" 
y="158" 
class="mono terminal role role-2"

building AI agents
  </text>

<text 
x="83" 
y="158" 
class="mono terminal role role-3"

training models
  </text>

<text 
x="83" 
y="158" 
class="mono terminal role role-4"

shipping products
  </text>

  <!-- Cursor -->
<rect
x="310"
y="139"
width="12"
height="24"
rx="1"
class="cursor"
/>








  <!-- Stack -->
<text 
x="55" 
y="220" 
class="mono stack"

AI · AGENTS · ML · FULL STACK
  </text>
</svg>
